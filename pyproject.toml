[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-red"
version = "0.1.0"
description = "Monitor de red en terminal: inventario de IPs por zona y ping en tiempo real."
requires-python = ">=3.10"
dependencies = ["textual>=8", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
monired = "monired.cli:main"

[tool.setuptools]
packages = ["monired"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
